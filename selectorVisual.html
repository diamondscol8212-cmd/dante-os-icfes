<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dante OS 3.0 - Selector Adaptativo Inteligente</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #0b0f19; color: #e2e8f0; padding: 30px; max-width: 900px; margin: 0 auto; }
        h1 { color: #38bdf8; border-bottom: 2px solid #1e293b; padding-bottom: 10px; }
        .card { background-color: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        input[type="range"] { width: 100%; accent-color: #38bdf8; }
        .valor { float: right; color: #38bdf8; font-family: monospace; font-size: 1.2em; font-weight: bold; }
        .grid-preguntas { display: grid; grid-template-columns: 1fr; gap: 15px; margin-top: 20px; }
        .item-pregunta { background-color: #0f172a; border-left: 5px solid #64748b; padding: 15px; border-radius: 6px; transition: all 0.3s ease; }
        .item-pregunta.seleccionada { border-left-color: #4ade80; background-color: #14532d; box-shadow: 0 0 15px rgba(74, 222, 128, 0.2); }
        .badge { display: inline-block; padding: 3px 8px; font-size: 0.8rem; font-weight: bold; border-radius: 4px; margin-top: 5px; text-transform: uppercase; }
        .badge-optima { background-color: #22c55e; color: #fff; }
        .badge-sub { background-color: #3b82f6; color: #fff; }
    </style>
</head>
<body>

    <h1>🎯 Dante OS 3.0: Selector Inteligente (Simulación)</h1>
    <p>Simula el cambio de habilidad de las niñas para observar qué pregunta del banco escoge el motor de manera automática.</p>

    <div class="card">
        <label>Habilidad Actual de la Estudiante (&theta;): <span id="txtTheta" class="valor">0.0</span></label>
        <input type="range" id="sliderTheta" min="-3" max="3" step="0.1" value="-0.5">
        <small style="color: #94a3b8;">El algoritmo buscará la pregunta más cercana al 60% de probabilidad de acierto.</small>
    </div>

    <h2>📦 Estado del Banco de Preguntas en Evaluación:</h2>
    <div id="contenedorBanco" class="grid-preguntas"></div>

    <script>
        // Banco local idéntico al inyectado en Supabase para emular la consulta
        const bancoItems = [
            {
                pregunta_texto: "En una carrera de atletismo, Samantha corre a una velocidad constante de 6 metros por segundo. ¿Qué distancia recorrerá en un minuto y medio?",
                parametro_a_discriminacion: 1.25,
                parametro_b_dificultad: -0.8,
                parametro_c_adivinacion: 0.25,
                sub_competencia: "algebra"
            },
            {
                pregunta_texto: "Si Elizabeth duplica la longitud del radio de una pizza circular, ¿qué ocurre con el área total de la superficie de la pizza?",
                parametro_a_discriminacion: 1.6,
                parametro_b_dificultad: 0.5,
                parametro_c_adivinacion: 0.25,
                sub_competencia: "geometria"
            },
            {
                pregunta_texto: "Un canal de televisión registra que el 40% de los televidentes prefiere programas educativos. ¿Cuál es la probabilidad de que las dos primeras personas encuestadas prefieran este tipo de programas?",
                parametro_a_discriminacion: 1.45,
                parametro_b_dificultad: 1.1,
                parametro_c_adivinacion: 0.25,
                sub_competencia: "estadistica"
            }
        ];

        // Lógica Matemática 3PL Pura
        function calcularProbabilidadAcierto3PL(theta, a, b, c) {
            const exponente = -a * (theta - b);
            return c + ((1 - c) / (1 + Math.exp(exponente)));
        }

        function evaluarBanco() {
            const theta = parseFloat(document.getElementById('sliderTheta').value);
            document.getElementById('txtTheta').innerText = theta.toFixed(1);

            let mejorDistancia = Infinity;
            let indiceGanador = -1;
            const OBJETIVO = 0.60;

            // Mapear probabilidades y distancias
            const resultados = bancoItems.map((item, index) => {
                const prob = calcularProbabilidadAcierto3PL(theta, item.parametro_a_discriminacion, item.parametro_b_dificultad, item.parametro_c_adivinacion);
                const distancia = Math.abs(prob - OBJETIVO);
                
                if (distancia < mejorDistancia) {
                    mejorDistancia = distancia;
                    indiceGanador = index;
                }
                return { ...item, probabilidad: prob };
            });

            // Renderizar la interfaz interactiva
            const contenedor = document.getElementById('contenedorBanco');
            contenedor.innerHTML = '';

            resultados.forEach((item, index) => {
                const esGanador = (index === indiceGanador);
                const div = document.createElement('div');
                div.className = `item-pregunta ${esGanador ? 'seleccionada' : ''}`;
                
                div.innerHTML = `
                    <p style="margin: 0 0 10px 0; font-size: 1.05em; font-weight: 500;">${item.pregunta_texto}</p>
                    <span class="badge badge-sub">${item.sub_competencia}</span>
                    ${esGanador ? '<span class="badge badge-topica">🎯 SELECCIONADA POR EL MOTOR</span>' : ''}
                    <div style="margin-top: 10px; font-size: 0.9em; color: #94a3b8;">
                        Dificultad (b): ${item.parametro_b_dificultad} | 
                        Probabilidad estimada de éxito: <strong style="color: ${esGanador ? '#4ade80' : '#cbd5e1'}">${(item.probabilidad * 100).toFixed(2)}%</strong>
                    </div>
                `;
                contenedor.appendChild(div);
            });
        }

        document.getElementById('sliderTheta').addEventListener('input', evaluarBanco);
        evaluarBanco(); // Carga inicial
    </script>
</body>
</html>
