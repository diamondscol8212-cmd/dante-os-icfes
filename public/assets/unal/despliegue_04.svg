<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="200">
  <rect width="400" height="300" fill="#0f172a" rx="12"/>
  <text x="200" y="32" fill="#38bdf8" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">UNAL · Desarrollo plano (plantilla)</text>

  <g transform="translate(110, 55)">
    <!-- Cara superior -->
    <polygon points="90,10 150,70 90,70 30,70" fill="#1e293b" stroke="#6366f1" stroke-width="2"/>
    <text x="90" y="55" fill="#94a3b8" font-size="10" text-anchor="middle">T1</text>

    <!-- Cara izquierda -->
    <polygon points="30,70 90,70 90,130 30,130" fill="#1e293b" stroke="#6366f1" stroke-width="2"/>
    <polygon points="30,70 90,100 30,130" fill="#334155" stroke="#f59e0b" stroke-width="2"/>
    <text x="48" y="105" fill="#94a3b8" font-size="10" text-anchor="middle">T2</text>

    <!-- Base cuadrada central -->
    <rect x="90" y="70" width="60" height="60" fill="#1e293b" stroke="#10b981" stroke-width="3"/>
    <text x="120" y="105" fill="#10b981" font-size="11" text-anchor="middle" font-weight="bold">BASE</text>

    <!-- Cara derecha -->
    <polygon points="150,70 210,70 210,130 150,130" fill="#1e293b" stroke="#6366f1" stroke-width="2"/>
    <polygon points="150,70 210,100 150,130" fill="#334155" stroke="#f59e0b" stroke-width="2"/>
    <text x="192" y="105" fill="#94a3b8" font-size="10" text-anchor="middle">T3</text>

    <!-- Cara inferior -->
    <polygon points="90,130 150,130 120,190" fill="#1e293b" stroke="#6366f1" stroke-width="2"/>
    <text x="120" y="158" fill="#94a3b8" font-size="10" text-anchor="middle">T4</text>
  </g>

  <text x="200" y="275" fill="#94a3b8" font-size="12" text-anchor="middle">Al unir los vértices superiores se cierra una pirámide</text>
</svg>
