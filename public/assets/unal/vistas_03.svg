<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="200">
  <rect width="400" height="300" fill="#0f172a" rx="12"/>
  <text x="200" y="32" fill="#38bdf8" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">UNAL · Vistas ortogonales</text>

  <!-- Vista frontal: cuadrado con diagonales cruzadas -->
  <g transform="translate(45, 70)">
    <rect x="0" y="0" width="140" height="140" fill="#1e293b" stroke="#38bdf8" stroke-width="3" rx="4"/>
    <line x1="0" y1="0" x2="140" y2="140" stroke="#f59e0b" stroke-width="2.5"/>
    <line x1="140" y1="0" x2="0" y2="140" stroke="#f59e0b" stroke-width="2.5"/>
    <circle cx="70" cy="70" r="4" fill="#06b6d4"/>
    <text x="70" y="168" fill="#94a3b8" font-size="12" text-anchor="middle">Vista frontal</text>
  </g>

  <!-- Vista lateral: triángulo isósceles -->
  <g transform="translate(230, 70)">
    <rect x="0" y="0" width="140" height="140" fill="#1e293b" stroke="#10b981" stroke-width="2" rx="4"/>
    <polygon points="70,18 128,122 12,122" fill="none" stroke="#f59e0b" stroke-width="3"/>
    <line x1="12" y1="122" x2="128" y2="122" stroke="#06b6d4" stroke-width="2"/>
    <text x="70" y="168" fill="#94a3b8" font-size="12" text-anchor="middle">Vista lateral</text>
  </g>

  <text x="200" y="275" fill="#94a3b8" font-size="12" text-anchor="middle">¿Qué sólido 3D corresponde a estas proyecciones?</text>
</svg>
