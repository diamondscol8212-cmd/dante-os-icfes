<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="200">
  <rect width="400" height="300" fill="#0f172a" rx="12"/>
  <text x="200" y="35" fill="#38bdf8" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">UNAL - Análisis de Imagen: Rotación Tridimensional</text>
  <g transform="translate(60, 80)">
    <!-- Objeto Base -->
    <rect x="0" y="0" width="70" height="70" fill="#1e293b" stroke="#38bdf8" stroke-width="3" rx="6"/>
    <polygon points="35,10 60,60 10,60" fill="#f59e0b"/>
    <circle cx="35" cy="40" r="10" fill="#06b6d4"/>
    <text x="35" y="95" fill="#94a3b8" font-size="12" text-anchor="middle">Patrón A (Base)</text>
  </g>
  <g transform="translate(260, 80)">
    <!-- Objeto Rotado 90 deg -->
    <rect x="0" y="0" width="70" height="70" fill="#1e293b" stroke="#10b981" stroke-width="3" rx="6"/>
    <polygon points="60,35 10,60 10,10" fill="#f59e0b"/>
    <circle cx="30" cy="35" r="10" fill="#06b6d4"/>
    <text x="35" y="95" fill="#94a3b8" font-size="12" text-anchor="middle">Vista Incógnita (90° Horario)</text>
  </g>
  <path d="M 150 115 Q 200 80 230 115" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="4"/>
  <polygon points="230,115 220,110 223,122" fill="#e2e8f0"/>
</svg>
