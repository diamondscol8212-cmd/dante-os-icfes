    <rect x="40" y="80" width="40" height="40" fill="#1e293b" stroke="#6366f1" stroke-width="2"/>
    <circle cx="60" cy="100" r="10" fill="#8b5cf6"/>

    <rect x="40" y="120" width="40" height="40" fill="#1e293b" stroke="#6366f1" stroke-width="2"/>
    <rect x="52" y="132" width="16" height="16" fill="#ef4444"/>
  </g>
  <text x="200" y="275" fill="#94a3b8" font-size="12" text-anchor="middle">¿Cuál sólido resulta al armar la plantilla bidimensional?</text>
