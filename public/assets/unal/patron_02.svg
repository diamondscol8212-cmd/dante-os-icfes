  <g transform="translate(140, 60)">
    <!-- Despliegue de Dado/Cubo -->
    <rect x="40" y="0" width="40" height="40" fill="#1e293b" stroke="#6366f1" stroke-width="2"/>
    <circle cx="60" cy="20" r="6" fill="#ec4899"/>
    
    <rect x="0" y="40" width="40" height="40" fill="#1e293b" stroke="#6366f1" stroke-width="2"/>
    <rect x="10" y="50" width="20" height="20" fill="#10b981"/>
    
    <rect x="40" y="40" width="40" height="40" fill="#1e293b" stroke="#6366f1" stroke-width="2"/>
