<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Dante OS · Limpiar este navegador</title>
    <style>
        :root {
            --bg: #0b1220;
            --card: #121a2b;
            --line: rgba(148, 163, 184, 0.28);
            --text: #e8eef8;
            --mute: #94a3b8;
            --ok: #34d399;
            --warn: #fbbf24;
            --accent: #f59e0b;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 1.25rem;
            background:
                radial-gradient(ellipse 80% 50% at 50% -10%, rgba(245, 158, 11, 0.18), transparent 55%),
                var(--bg);
            color: var(--text);
            font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        }
        .card {
            width: min(26rem, 100%);
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 1.35rem;
            padding: 1.4rem 1.25rem 1.25rem;
            text-align: center;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
        }
        .icon {
            width: 3.4rem;
            height: 3.4rem;
            margin: 0 auto 0.9rem;
            border-radius: 1rem;
            display: grid;
            place-items: center;
            background: rgba(245, 158, 11, 0.14);
            border: 1px solid rgba(245, 158, 11, 0.35);
            color: var(--accent);
            font-size: 1.35rem;
        }
        h1 {
            margin: 0;
            font-size: 1.2rem;
            letter-spacing: -0.02em;
        }
        .lead {
            margin: 0.55rem 0 0;
            color: var(--mute);
            font-size: 0.82rem;
            line-height: 1.45;
        }
        .steps {
            margin: 1.1rem 0;
            padding: 0.85rem 0.9rem;
            border-radius: 0.9rem;
            background: rgba(2, 6, 23, 0.55);
            border: 1px solid var(--line);
            text-align: left;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 0.72rem;
            line-height: 1.55;
            color: var(--mute);
        }
        .steps .ok { color: var(--ok); }
        .steps .run { color: var(--warn); }
        .btn {
            display: block;
            width: 100%;
            border: 0;
            border-radius: 0.9rem;
            padding: 0.95rem 1rem;
            font-weight: 800;
            font-size: 0.78rem;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            cursor: pointer;
            color: #111827;
            background: linear-gradient(135deg, #f59e0b, #eab308);
        }
        .btn:disabled {
            opacity: 0.65;
            cursor: wait;
        }
        .link {
            display: block;
            margin-top: 0.75rem;
            color: var(--mute);
            text-decoration: none;
            font-size: 0.78rem;
        }
        .link:hover { color: var(--text); }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon" aria-hidden="true">🧹</div>
        <h1>Limpiar este navegador</h1>
        <p class="lead">
            Borra caché profunda, Service Worker, cookies y memoria local de Dante en este aparato.
            Luego te lleva al login limpio para probar de cero.
        </p>
        <div id="steps" class="steps" aria-live="polite">
            <div id="s1">1. Esperando…</div>
            <div id="s2">2. Cerrar sesión del servidor</div>
            <div id="s3">3. Vaciar memoria y caché</div>
            <div id="s4">4. Ir al login limpio</div>
        </div>
        <button id="btnReset" class="btn" type="button">Limpiar todo ahora</button>
        <a class="link" href="/login.html">Volver sin borrar</a>
    </div>

    <script>
        (function () {
            var enCurso = false;
            var bust = 'r=' + Date.now();

            function paso(id, estado, texto) {
                var el = document.getElementById(id);
                if (!el) return;
                el.className = estado || '';
                el.textContent = texto;
            }

            function sleep(ms) {
                return new Promise(function (resolve) { setTimeout(resolve, ms); });
            }

            async function cerrarSesionServidor(tokenViejo) {
                try {
                    var configResp = await fetch('/api/v1/auth/config', { credentials: 'include', cache: 'no-store' });
                    if (configResp.ok && window.supabase) {
                        var cfg = await configResp.json();
                        if (cfg.hasSupabase && cfg.supabaseUrl && cfg.supabaseKey) {
                            var client = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseKey);
                            await client.auth.signOut({ scope: 'global' }).catch(function () {});
                        }
                    }
                } catch (e) {}
                try {
                    await fetch('/api/auth/logout', {
                        method: 'POST',
                        credentials: 'include',
                        cache: 'no-store',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ token: tokenViejo || '' })
                    });
                } catch (e) {}
            }

            function borrarCookies() {
                try {
                    var host = location.hostname;
                    var parts = host.split('.');
                    var dominios = ['', host];
                    if (parts.length >= 2) dominios.push('.' + parts.slice(-2).join('.'));
                    if (parts.length >= 3) dominios.push('.' + parts.slice(-3).join('.'));
                    var paths = ['/', '/login.html', '/perfil.html', '/onboarding.html'];
                    document.cookie.split(';').forEach(function (raw) {
                        var nombre = raw.replace(/^ +/, '').split('=')[0];
                        if (!nombre) return;
                        dominios.forEach(function (dom) {
                            paths.forEach(function (p) {
                                var base = nombre + '=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=' + p + ';Max-Age=0';
                                document.cookie = base;
                                if (dom) document.cookie = base + ';domain=' + dom;
                            });
                        });
                    });
                } catch (e) {}
            }

            async function borrarCaches() {
                if (!('caches' in window)) return;
                try {
                    var names = await caches.keys();
                    await Promise.all(names.map(function (name) { return caches.delete(name); }));
                } catch (e) {}
            }

            async function borrarServiceWorkers() {
                if (!('serviceWorker' in navigator)) return;
                try {
                    var regs = await navigator.serviceWorker.getRegistrations();
                    await Promise.all(regs.map(function (reg) { return reg.unregister(); }));
                } catch (e) {}
            }

            async function borrarIndexedDB() {
                try {
                    if (window.indexedDB && indexedDB.databases) {
                        var dbs = await indexedDB.databases();
                        await Promise.all((dbs || []).map(function (db) {
                            if (!db || !db.name) return Promise.resolve();
                            return new Promise(function (resolve) {
                                var req = indexedDB.deleteDatabase(db.name);
                                req.onsuccess = req.onerror = req.onblocked = function () { resolve(); };
                            });
                        }));
                    }
                } catch (e) {}
            }

            function vaciarStorage() {
                try { localStorage.clear(); } catch (e) {}
                try { sessionStorage.clear(); } catch (e) {}
                try {
                    var keys = [];
                    for (var i = 0; i < localStorage.length; i++) {
                        var k = localStorage.key(i);
                        if (k) keys.push(k);
                    }
                    keys.forEach(function (k) {
                        try { localStorage.removeItem(k); } catch (e2) {}
                    });
                } catch (e) {}
            }

            async function limpiarProfundo() {
                if (enCurso) return;
                enCurso = true;
                var btn = document.getElementById('btnReset');
                if (btn) {
                    btn.disabled = true;
                    btn.textContent = 'Limpiando…';
                }

                var tokenViejo = '';
                try {
                    tokenViejo = localStorage.getItem('dante_token')
                        || localStorage.getItem('dante_jwt')
                        || '';
                } catch (e) {}

                paso('s1', 'run', '1. Empezó el borrado profundo…');
                paso('s2', 'run', '2. Cerrando sesión del servidor…');
                await Promise.race([
                    cerrarSesionServidor(tokenViejo),
                    sleep(4500)
                ]);
                paso('s2', 'ok', '2. Sesión del servidor cerrada.');

                paso('s3', 'run', '3. Vaciando memoria, cookies, SW y caché…');
                vaciarStorage();
                borrarCookies();
                await borrarServiceWorkers();
                await borrarCaches();
                await borrarIndexedDB();
                vaciarStorage();
                try { sessionStorage.setItem('dante_reset_listo', '1'); } catch (e) {}
                paso('s3', 'ok', '3. Memoria y caché vaciadas.');

                paso('s4', 'run', '4. Abriendo login limpio…');
                await sleep(350);
                window.location.replace('/login.html?limpio=1&' + bust);
            }

            document.addEventListener('DOMContentLoaded', function () {
                var btn = document.getElementById('btnReset');
                if (btn) btn.addEventListener('click', limpiarProfundo);
                // Al abrir /reset desde el explorador, limpia solo.
                setTimeout(limpiarProfundo, 250);
            });
        })();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</body>
</html>
