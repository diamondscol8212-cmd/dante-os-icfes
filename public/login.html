<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dante OS // Autenticación Perimetral de Portal</title>
    <style>
        :root {
            --bg-deep: #0b0c10;
            --bg-surface: #14161d;
            --gold-satin: #d4af37;
            --gold-glow: rgba(212, 175, 55, 0.15);
            --text-main: #f0f1f5;
            --text-muted: #9499a7;
            --graphite: #2b2e3a;
            --cyan-core: #51e2f5;
            --purple-core: #a855f7;
            --font-editorial: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: var(--bg-deep); color: var(--text-main); font-family: var(--font-editorial);
            background-image: radial-gradient(circle at 50% 30%, #191c26 0%, #0b0c10 100%);
            min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; padding: 2.5rem; line-height: 1.6;
        }

        .gateway-container { display: flex; justify-content: center; align-items: center; flex-grow: 1; }
        .gateway-card {
            background: var(--bg-surface); border: 1px solid var(--graphite);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5); border-radius: 8px; padding: 3.5rem; width: 100%; max-width: 540px; text-align: center; position: relative;
        }
        .gateway-title { font-size: 1.8rem; font-weight: 300; text-transform: uppercase; letter-spacing: 4px; color: var(--gold-satin); margin-bottom: 0.5rem; }
        
        .verification-banner {
            background: rgba(168, 85, 247, 0.15); border: 1px solid var(--purple-core);
            padding: 0.6rem; border-radius: 4px; color: var(--cyan-core); font-size: 0.8rem;
            font-weight: bold; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 2rem;
            box-shadow: 0 0 15px rgba(81, 226, 245, 0.1);
        }

        .system-version-tag {
            position: absolute; top: 1.5rem; right: 1.5rem; font-size: 0.75rem; font-weight: bold;
            color: var(--cyan-core); letter-spacing: 1px; text-transform: uppercase;
        }

        .role-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 1.5rem; text-align: left; }
        .role-selection-card {
            background: #1a1d26; border: 1px solid var(--graphite); border-radius: 6px; padding: 1.2rem; cursor: pointer; transition: all 0.2s ease;
        }
        .role-selection-card:hover { border-color: var(--gold-satin); background: #1f232e; }
        .role-selection-card.active { border-color: var(--gold-satin); background: rgba(212, 175, 55, 0.04); box-shadow: 0 0 15px var(--gold-glow); }
        .role-emoji { font-size: 1.5rem; margin-bottom: 0.4rem; display: block; }
        .role-title { font-size: 0.85rem; font-weight: 600; text-transform: uppercase; color: #fff; letter-spacing: 1px; }

        .input-group { text-align: left; margin-top: 1.2rem; }
        .input-label { display: block; color: var(--text-muted); margin-bottom: 0.4rem; font-weight: 600; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 1px; }
        
        .input-cyber {
            width: 100%; padding: 1rem; background: #1a1d26; border: 1px solid var(--graphite);
            color: #fff; border-radius: 4px; outline: none; font-size: 0.9rem; transition: all 0.2s;
        }
        .input-cyber:focus { border-color: var(--gold-satin); box-shadow: 0 0 10px rgba(212, 175, 55, 0.2); }

        .btn-premium {
            width: 100%; padding: 1.2rem; background: transparent; border: 1px solid var(--gold-satin);
            color: var(--gold-satin); font-weight: 600; text-transform: uppercase; letter-spacing: 2px;
            border-radius: 4px; cursor: pointer; transition: all 0.3s ease; margin-top: 2rem;
        }
        .btn-premium:hover { background: var(--gold-satin); color: var(--bg-deep); box-shadow: 0 0 20px var(--gold-glow); }
        .btn-premium:disabled { border-color: var(--graphite); color: var(--text-muted); cursor: not-allowed; }

        footer { text-align: center; font-size: 10px; font-mono: true; color: #2b2e3a; letter-spacing: 1px; text-transform: uppercase; }
    </style>
</head>
<body>

    <div class="gateway-container">
        <div class="gateway-card">
            <div class="system-version-tag">GATEWAY: v20.6.3</div>
            <div class="verification-banner">> AUTENTICACIÓN PERIMETRAL CORE</div>
            
            <h1 class="gateway-title">Dante OS</h1>
            <p style="font-size: 0.75rem; font-family: monospace; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px;">Pasarela de Verificación PBKDF2 & Multi-Tenancy</p>

            <div class="role-grid">
                <div id="cardRoleEstudiante" class="role-selection-card active" onclick="PortalAuth.seleccionarRol('estudiante')">
                    <span class="role-emoji">🧠</span>
                    <div class="role-title">Sala Alumno</div>
                </div>
                <div id="cardRoleRector" class="role-selection-card" onclick="PortalAuth.seleccionarRol('rector')">
                    <span class="role-emoji">🏛️</span>
                    <div class="role-title">Suite Rector</div>
                </div>
            </div>

            <div class="input-group" style="margin-top: 1.8rem;">
                <label class="input-label">ID de Institución (Tenant)</label>
                <input type="text" id="txtInstitutionId" class="input-cyber" value="colegio_sandbox_default" placeholder="colegio_id">
            </div>

            <div class="input-group">
                <label class="input-label">Credencial de Correo</label>
                <input type="email" id="txtEmail" class="input-cyber" placeholder="usuario@danteos.edu.co" autocomplete="username">
            </div>

            <div class="input-group">
                <label class="input-label">Firma Secreta Acceso</label>
                <input type="password" id="txtPassword" class="input-cyber" placeholder="••••••••" autocomplete="current-password">
            </div>

            <button class="btn-premium" id="btnValidar" onclick="PortalAuth.ejecutarLoginPerimetral()">Validar Firmas Criptográficas</button>
        </div>
    </div>

    <footer>
        DANTE OS v20.6.3 // INFRAESTRUCTURA UNICORNIO PARA TOMA DE DECISIONES BAJO INCERTIDUMBRE
    </footer>

    <script>
        const HOST_URL = window.location.origin;
        let SelectedRoleTarget = "estudiante"; // Rol por defecto en el arranque en frío

        class PortalAuth {
            static seleccionarRol(rol) {
                SelectedRoleTarget = rol;
                document.getElementById("cardRoleEstudiante").classList.remove("active");
                document.getElementById("cardRoleRector").classList.remove("active");

                if (rol === "estudiante") {
                    document.getElementById("cardRoleEstudiante").classList.add("active");
                } else {
                    document.getElementById("cardRoleRector").classList.add("active");
                }
                console.log(`🔒 [ROLE SELECTION CHANGED]: Objetivo alterado a -> [${rol.toUpperCase()}]`);
            }

            static async ejecutarLoginPerimetral() {
                const btn = document.getElementById("btnValidar");
                const institutionId = document.getElementById("txtInstitutionId").value.trim();
                const email = document.getElementById("txtEmail").value.trim();
                const password = document.getElementById("txtPassword").value;

                if (!email || !password || !institutionId) {
                    alert("🚨 CONTROL DE SEGURIDAD: Todos los campos del contrato perimetral son mandatorios.");
                    return;
                }

                btn.innerText = "Procesando Algoritmo Criptográfico PBKDF2...";
                btn.disabled = true;

                try {
                    const res = await fetch(`${HOST_URL}/api/auth/login-perimetral`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            email: email,
                            password: password,
                            institution_id: institutionId
                        })
                    });

                    const json = await res.json();

                    if (json && json.success) {
                        // 🪐 PERSISTENCIA DE CONTROL COMPATIBLE CON index.html Y rector.html
                        localStorage.setItem("dante_token", json.token_session);
                        localStorage.setItem("dante_user", JSON.stringify(json.user));

                        console.log("✅ [AUTENTICACIÓN EXITOSA]: Contextos inyectados localmente en caché.");
                        
                        // Redirección inteligente dictaminada directamente por el rol de Supabase
                        window.location.href = json.redireccion;
                    } else {
                        alert(`❌ ACCESO DENEGADO PERIMETRAL:\n\n${json.error || "Credenciales inválidas."}`);
                        btn.innerText = "Validar Firmas Criptográficas";
                        btn.disabled = false;
                    }
                } catch (err) {
                    console.error("🚨 [GATEWAY AUTH CRASH]:", err.message);
                    alert("Cortocircuito crítico en la pasarela perimetral de autenticación web.");
                    btn.innerText = "Validar Firmas Criptográficas";
                    btn.disabled = false;
                }
            }
        }
    </script>
</body>
</html>
