<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DANTE OS // CALIBRACIÓN INICIAL</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;900&family=JetBrains+Mono:wght@400;500;700;900&family=Oswald:wght@700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #51e2f5; 
            --gold: #D4AF37;
            --alert: #ff0044;
            --bg: #010103; 
            --card-bg: rgba(12, 14, 22, 0.94);
            --border-graphite: rgba(255, 255, 255, 0.12);
        }

        body, html { 
            background: var(--bg); color: #f0f1f5; margin: 0; font-family: 'Outfit', sans-serif; 
            height: 100vh; overflow: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center;
        }

        .font-mono { font-family: 'JetBrains Mono', monospace !important; }

        #dante-fractal-bg { position: fixed; inset: 0; z-index: 0; opacity: 0.18; pointer-events: none; mix-blend-mode: screen; }
        .scanline { position: fixed; inset: 0; background: linear-gradient(to bottom, transparent 50%, rgba(0,0,0,0.5) 51%); background-size: 100% 4px; z-index: 1; pointer-events: none; opacity: 0.2; }

        .onboard-card {
            background: var(--card-bg); border: 1px solid var(--border-graphite);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.95); border-radius: 16px; 
            padding: 3rem 2.5rem; width: 92%; max-width: 720px; text-align: center; position: relative; z-index: 10;
            backdrop-filter: blur(24px);
        }
        .onboard-card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--gold), var(--primary)); 
            box-shadow: 0 0 20px var(--gold); border-radius: 16px 16px 0 0;
        }

        .option-btn {
            background: rgba(20, 24, 35, 0.85); border: 1px solid var(--border-graphite); border-radius: 10px;
            padding: 1.3rem 1.5rem; width: 100%; text-align: left; font-size: 1.05rem; font-weight: 600; color: #fff;
            transition: all 0.2s ease; cursor: pointer; font-family: 'JetBrains Mono'; margin-top: 1rem;
            line-height: 1.5;
        }
        .option-btn:hover { border-color: var(--gold); background: rgba(212, 175, 55, 0.12); transform: translateY(-2px); box-shadow: 0 0 15px rgba(212, 175, 55, 0.2); }
        .option-btn:active { transform: scale(0.98); }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="scanline"></div>
    <canvas id="dante-fractal-bg"></canvas>

    <div class="onboard-card" id="card-main">
        <div class="font-mono text-xs md:text-sm text-[#D4AF37] tracking-[0.4em] uppercase mb-3 font-bold">NÚCLEO DANTE // CALIBRACIÓN DE ENTRADA</div>
        <h1 class="oswald font-black text-2xl md:text-3xl tracking-wider text-white mb-6 uppercase" id="step-title">DILEMA 01 / 03</h1>
        
        <p id="dilema-text" class="text-base md:text-lg font-light text-zinc-200 mb-6 font-mono leading-relaxed text-left bg-black/50 p-5 rounded-lg border border-white/10 shadow-inner">
            Sincronizando estímulo conductual...
        </p>

        <div id="options-container" class="space-y-3">
            <!-- Inyección dinámica de opciones -->
        </div>

        <div class="mt-8 flex justify-between items-center text-xs md:text-sm font-mono text-zinc-400 uppercase tracking-widest pt-2 border-t border-white/10">
            <span>Latencia: <span id="timer-val" class="text-cyan-400 font-bold">0.0s</span></span>
            <span>Seguridad: Activa</span>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://erjmvkmhpbvrqiqlddij.supabase.co'; 
        const SUPABASE_KEY = 'sb_publishable_RZHft13G4xVwBIdhgZp1gQ_K9raK05f';
        let supabaseClient = null;
        try { if (window.supabase) supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); } catch(e){}

        const DILEMAS = [
            {
                text: "Bajo presión de tiempo en una decisión incierta y compleja, tu tendencia natural es:",
                opts: [
                    { text: "A) Decidir de inmediato confiando en la primera intuición (Sistema 1).", type: "IMPULSIVO" },
                    { text: "B) Revisar cada detalle analítico aunque se agote el tiempo disponible (Sistema 2).", type: "ANALITICO" }
                ]
            },
            {
                text: "Ante un error crítico cometido en la primera fase de un proceso, tu respuesta inmediata es:",
                opts: [
                    { text: "A) Asumir el riesgo de inmediato y doblar la apuesta para recuperar lo perdido.", type: "RIESGO" },
                    { text: "B) Detener la marcha, asegurar el capital restante y buscar control.", type: "CONSERVADOR" }
                ]
            },
            {
                text: "Al recibir un resultado inesperado o desfavorable en una evaluación, consideras que:",
                opts: [
                    { text: "A) El sistema es injusto o el método de medición presenta fallas externas.", type: "DEFENSIVO" },
                    { text: "B) Es una señal directa para ajustar mis parámetros internos de análisis.", type: "ESTRATEGICO" }
                ]
            }
        ];

        let currentStep = 0;
        let scores = { IMPULSIVO: 0, ANALITICO: 0, RIESGO: 0, CONSERVADOR: 0, DEFENSIVO: 0, ESTRATEGICO: 0 };
        let startTime = Date.now();
        let timerInterval = null;

        function updateLatencyDisplay() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                let elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
                const timerEl = document.getElementById('timer-val');
                if (timerEl) timerEl.innerText = `${elapsed}s`;
            }, 100);
        }

        function loadStep() {
            if (currentStep >= DILEMAS.length) {
                finalizeOnboarding();
                return;
            }

            const d = DILEMAS[currentStep];
            document.getElementById('step-title').innerText = `DILEMA 0${currentStep + 1} / 03`;
            document.getElementById('dilema-text').innerText = d.text;
            
            const optCont = document.getElementById('options-container');
            optCont.innerHTML = "";

            d.opts.forEach((o) => {
                const btn = document.createElement('button');
                btn.className = "option-btn";
                btn.innerText = o.text;
                btn.onclick = () => registerChoice(o.type);
                optCont.appendChild(btn);
            });

            startTime = Date.now();
            updateLatencyDisplay();
        }

        function registerChoice(type) {
            let latency = Date.now() - startTime;
            scores[type] = (scores[type] || 0) + 1;
            
            if (latency < 1500) {
                scores['IMPULSIVO'] = (scores['IMPULSIVO'] || 0) + 1;
            }

            currentStep++;
            loadStep();
        }

        async function finalizeOnboarding() {
            if (timerInterval) clearInterval(timerInterval);

            let primaryArquetipo = Object.keys(scores).reduce((a, b) => scores[a] > scores[b] ? a : b);
            let arquetipoFinal = `ARQUETIPO_${primaryArquetipo}`;

            let userSession = {};
            try {
                userSession = JSON.parse(localStorage.getItem('dante_user')) || {};
            } catch(e) {}
            
            userSession.arquetipo = arquetipoFinal;
            userSession.onboarding_completed = true;
            localStorage.setItem('dante_user', JSON.stringify(userSession));

            const userIdentifier = userSession.email || userSession.document_id || userSession.estudiante;
            const sessionToken = localStorage.getItem('dante_token') || `token_anon_${Date.now()}`;
            
            if (supabaseClient) {
                try {
                    // 1. Guardar en tabla dante_arquetipos_iniciales
                    await supabaseClient.from('dante_arquetipos_iniciales').upsert({
                        id_sesion: userIdentifier || sessionToken,
                        arquetipo: arquetipoFinal,
                        puntajes_crudos: scores
                    }, { onConflict: 'id_sesion' });

                    // 2. Actualizar estado en tabla usuarios para persistencia permanente
                    if (userSession.email || userSession.document_id) {
                        const cond = userSession.email ? `email.eq.${userSession.email}` : `document_id.eq.${userSession.document_id}`;
                        await supabaseClient.from('usuarios')
                            .update({ 
                                arquetipo: arquetipoFinal, 
                                onboarding_completed: true 
                            })
                            .or(cond);
                    }
                } catch(err) {
                    console.error("⚠️ Sincronización onboarding:", err);
                }
            }

            const card = document.getElementById('card-main');
            card.innerHTML = `
                <div class="font-mono text-xs text-[#51e2f5] tracking-[0.4em] uppercase mb-3 font-bold">SISTEMA RECALIBRADO</div>
                <h2 class="oswald font-black text-3xl text-white mb-3 uppercase">PERFIL AUTÉNTICO ACTIVADO</h2>
                <div class="my-5 p-4 bg-cyan-950/50 border border-cyan-500/40 rounded-lg font-mono text-cyan-400 text-sm md:text-base tracking-widest uppercase font-bold shadow-[0_0_20px_rgba(81,226,245,0.2)]">
                    ${arquetipoFinal}
                </div>
                <p class="text-sm font-mono text-zinc-300 leading-relaxed">Conectando con la Cabina de Examen...</p>
            `;

            setTimeout(() => {
                window.location.href = "index.html";
            }, 1200);
        }

        // Canvas Fractal
        const canvas = document.getElementById('dante-fractal-bg'); 
        const ctx = canvas ? canvas.getContext('2d') : null;
        let parts = [];

        function initCanvas() {
            if (!canvas || !ctx) return;
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            for(let i=0; i<60; i++) {
                parts.push({ 
                    x: canvas.width/2, 
                    y: canvas.height/2, 
                    s: Math.random()*1.5, 
                    v: Math.random()*0.35 + 0.1, 
                    angle: i*137.5*(Math.PI/180), 
                    dist: 0 
                });
            }
            animate();
        }

        function animate() {
            if (!ctx) return;
            ctx.clearRect(0,0,canvas.width,canvas.height);
            parts.forEach(p => {
                p.dist += p.v; 
                let x = canvas.width/2 + Math.cos(p.angle)*p.dist; 
                let y = canvas.height/2 + Math.sin(p.angle)*p.dist;
                if(x < 0 || x > canvas.width || y < 0 || y > canvas.height) p.dist = 0;
                ctx.beginPath(); ctx.arc(x,y,p.s,0,Math.PI*2); ctx.fillStyle='#51e2f5'; ctx.globalAlpha=0.22; ctx.fill();
            });
            requestAnimationFrame(animate);
        }

        window.addEventListener('DOMContentLoaded', () => {
            initCanvas();
            loadStep();
        });
    </script>
</body>
</html>
