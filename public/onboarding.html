<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DANTE OS // CALIBRACIÓN INICIAL</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;900&family=JetBrains+Mono:wght@400;500;700;900&family=Oswald:wght@700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #51e2f5; 
            --gold: #D4AF37;
            --alert: #ff0044;
            --bg: #010103; 
            --card-bg: rgba(12, 14, 22, 0.92);
            --border-graphite: rgba(255, 255, 255, 0.08);
        }

        body, html { 
            background: var(--bg); color: #f0f1f5; margin: 0; font-family: 'Outfit', sans-serif; 
            height: 100vh; overflow: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center;
        }

        .font-mono { font-family: 'JetBrains Mono', monospace !important; }

        #dante-fractal-bg { position: fixed; inset: 0; z-index: 0; opacity: 0.15; pointer-events: none; mix-blend-mode: screen; }
        .scanline { position: fixed; inset: 0; background: linear-gradient(to bottom, transparent 50%, rgba(0,0,0,0.5) 51%); background-size: 100% 4px; z-index: 1; pointer-events: none; opacity: 0.2; }

        .onboard-card {
            background: var(--card-bg); border: 1px solid var(--border-graphite);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.95); border-radius: 14px; 
            padding: 2.5rem 2rem; width: 100%; max-width: 540px; text-align: center; position: relative; z-index: 10;
            backdrop-filter: blur(24px);
        }
        .onboard-card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 3px;
            background: linear-gradient(90deg, var(--primary), var(--gold), var(--primary)); 
            box-shadow: 0 0 20px var(--gold); border-radius: 14px 14px 0 0;
        }

        .option-btn {
            background: rgba(20, 24, 35, 0.8); border: 1px solid var(--border-graphite); border-radius: 8px;
            padding: 1.1rem; width: 100%; text-align: left; font-size: 0.88rem; font-weight: 600; color: #fff;
            transition: all 0.2s ease; cursor: pointer; font-family: 'JetBrains Mono'; margin-top: 0.8rem;
        }
        .option-btn:hover { border-color: var(--gold); background: rgba(212, 175, 55, 0.08); transform: translateY(-1px); }
        .option-btn:active { transform: scale(0.98); }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="scanline"></div>
    <canvas id="dante-fractal-bg"></canvas>

    <div class="onboard-card">
        <div class="font-mono text-[9px] text-[#D4AF37] tracking-[0.4em] uppercase mb-2">NÚCLEO DANTE // CALIBRACIÓN DE ENTRADA</div>
        <h1 class="oswald font-black text-xl tracking-wider text-white mb-6 uppercase" id="step-title">DILEMA 01 / 03</h1>
        
        <p id="dilema-text" class="text-sm font-light text-zinc-300 mb-6 font-mono leading-relaxed text-left bg-black/40 p-4 rounded border border-white/5">
            Cargando estímulo conductual...
        </p>

        <div id="options-container" class="space-y-2">
            <!-- Inyectado por JS -->
        </div>

        <div class="mt-6 flex justify-between items-center text-[10px] font-mono text-zinc-500 uppercase tracking-widest">
            <span>Latencia: <span id="timer-val" class="text-cyan-400">0.0s</span></span>
            <span>Seguridad: Activa</span>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://erjmvkmhpbvrqiqlddij.supabase.co'; 
        const SUPABASE_KEY = 'sb_publishable_RZHft13G4xVwBIdhgZp1gQ_K9raK05f';
        let supabaseClient = null;
        try { supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); } catch(e){}

        const DILEMAS = [
            {
                text: "Bajo presión de tiempo en una decisión incierta y compleja, tu tendencia natural es:",
                opts: [
                    { text: "A) Decidir de inmediato confiando en la primera intuición (Sistema 1).", type: "IMPULSIVO" },
                    { text: "B) Revisar cada detalle analítico aunque se agote el tiempo disponible (Sistema 2).", type: "ANALITICO" }
                ]
            },
            {
                text: "Ante un error crítico cometido en la primera fase de un proceso, tu respuesta inmediata es:",
                opts: [
                    { text: "A) Asumir el riesgo de inmediato y doblar la apuesta para recuperar lo perdido.", type: "RIESGO" },
                    { text: "B) Detener la marcha, asegurar el capital restante y buscar control.", type: "CONSERVADOR" }
                ]
            },
            {
                text: "Al recibir un resultado inesperado o desfavorable en una evaluación, consideras que:",
                opts: [
                    { text: "A) El sistema es injusto o el método de medición presenta fallas externas.", type: "DEFENSIVO" },
                    { text: "B) Es una señal directa para ajustar mis parámetros internos de análisis.", type: "ESTRATEGICO" }
                ]
            }
        ];

        let currentStep = 0;
        let scores = { IMPULSIVO: 0, ANALITICO: 0, RIESGO: 0, CONSERVADOR: 0, DEFENSIVO: 0, ESTRATEGICO: 0 };
        let startTime = Date.now();

        function loadStep() {
            if (currentStep >= DILEMAS.length) {
                finalizeOnboarding();
                return;
            }

            const d = DILEMAS[currentStep];
            document.getElementById('step-title').innerText = `DILEMA 0${currentStep + 1} / 03`;
            document.getElementById('dilema-text').innerText = d.text;
            
            const optCont = document.getElementById('options-container');
            optCont.innerHTML = "";

            d.opts.forEach((o, index) => {
                const btn = document.createElement('button');
                btn.className = "option-btn";
                btn.innerText = o.text;
                btn.onclick = () => registerChoice(o.type);
                optCont.appendChild(btn);
            });

            startTime = Date.now();
        }

        function registerChoice(type) {
            let latency = Date.now() - startTime;
            scores[type] = (scores[type] || 0) + 1;
            
            // Si respondió en menos de 1.5 segundos, refuerza el rasgo impulsivo
            if (latency < 1500) {
                scores['IMPULSIVO'] = (scores['IMPULSIVO'] || 0) + 1;
            }

            currentStep++;
            loadStep();
        }

        async function finalizeOnboarding() {
            // Determinar arquetipo principal
            let primaryArquetipo = Object.keys(scores).reduce((a, b) => scores[a] > scores[b] ? a : b);
            let arquetipoFinal = `ARQUETIPO_${primaryArquetipo}`;

            // Guardar en LocalStorage
            let userSession = JSON.parse(localStorage.getItem('dante_user')) || {};
            userSession.arquetipo = arquetipoFinal;
            localStorage.setItem('dante_user', JSON.stringify(userSession));

            // Enviar a Supabase si hay sesión activa
            const sessionToken = localStorage.getItem('dante_token');
            if (supabaseClient && sessionToken) {
                try {
                    await supabaseClient.from('dante_arquetipos_iniciales').upsert({
                        id_sesion: sessionToken,
                        arquetipo: arquetipoFinal,
                        puntajes_crudos: scores
                    }, { onConflict: 'id_sesion' });
                } catch(err) {
                    console.error("Error sincronizando arquetipo:", err);
                }
            }

            // Redirección inteligente al simulador ICFES
            document.body.innerHTML = `<div class='h-screen flex items-center justify-center font-mono text-cyan-400 text-xs tracking-[0.3em] uppercase'>[ PERFIL CALIBRADO: ${arquetipoFinal} ]<br>Redirigiendo a cabina...</div>`;
            setTimeout(() => {
                window.location.href = "index.html";
            }, 1200);
        }

        // Canvas Fractal de Fondo
        const canvas = document.getElementById('dante-fractal-bg'); 
        const ctx = canvas.getContext('2d');
        let parts = [];

        function initCanvas() {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            for(let i=0; i<50; i++) {
                parts.push({ x: canvas.width/2, y: canvas.height/2, s: Math.random()*1.5, v: Math.random()*0.3+0.1, angle: i*137.5*(Math.PI/180), dist: 0 });
            }
            animate();
        }

        function animate() {
            ctx.clearRect(0,0,canvas.width,canvas.height);
            parts.forEach(p => {
                p.dist += p.v; 
                let x = canvas.width/2 + Math.cos(p.angle)*p.dist; 
                let y = canvas.height/2 + Math.sin(p.angle)*p.dist;
                if(x < 0 || x > canvas.width || y < 0 || y > canvas.height) p.dist = 0;
                ctx.beginPath(); ctx.arc(x,y,p.s,0,Math.PI*2); ctx.fillStyle='#51e2f5'; ctx.globalAlpha=0.2; ctx.fill();
            });
            requestAnimationFrame(animate);
        }

        window.onload = initCanvas;
    </script>
</body>
</html>
