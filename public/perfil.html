<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Dante OS | MATRIZ ADN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;900&family=JetBrains+Mono:wght@400;500;800;900&family=Oswald:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --primary: #00ffcc; /* Color por defecto, mutará con JS */
            --gold: #D4AF37;
            --alert: #ff0044;
            --bg: #010103; 
        }

        body, html { 
            background: var(--bg); color: white; margin: 0; font-family: 'Outfit', sans-serif; 
            overflow: hidden; height: 100dvh; width: 100vw; touch-action: pan-y;
            -webkit-tap-highlight-color: transparent;
        }

        /* --- FONDOS --- */
        #dante-fractal-bg { position: fixed; inset: 0; z-index: 0; opacity: 0.15; pointer-events: none; mix-blend-mode: screen; }
        .scanline { position: fixed; inset: 0; background: linear-gradient(to bottom, transparent 50%, rgba(0,0,0,0.5) 51%); background-size: 100% 4px; z-index: 1; pointer-events: none; opacity: 0.2; }

        #fx-flash { position: fixed; inset: 0; z-index: 999999; background: var(--alert); opacity: 0; pointer-events: none; transition: opacity 0.3s; mix-blend-mode: screen; }

        /* --- HEADER --- */
        .master-hud {
            position: fixed; top: 0; width: 100%; z-index: 1000; padding: 25px 20px;
            background: linear-gradient(to bottom, rgba(1,1,3,0.95) 20%, transparent 100%);
            pointer-events: none; display: flex; justify-content: space-between; align-items: flex-start;
        }
        .alias-title { font-size: 18px; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; color: white; margin-bottom: 2px;}
        .geo-tag { font-family: 'JetBrains Mono'; font-size: 10px; color: var(--primary); letter-spacing: 2px; text-transform: uppercase; text-shadow: 0 0 10px var(--primary); }

        /* --- VIEWPORT Y SCROLL --- */
        .adn-viewport {
            position: fixed; inset: 0; z-index: 10;
            overflow-y: auto; overflow-x: hidden; scroll-behavior: smooth;
            padding: 100px 20px 120px;
        }
        .adn-viewport::-webkit-scrollbar { display: none; }

        /* --- LA TARJETA COLECCIONABLE (ADN CARD) --- */
        .adn-card {
            width: 100%; max-width: 420px; margin: 0 auto;
            background: rgba(10,10,15,0.8); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            padding: 30px 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.9), inset 0 0 40px rgba(255,255,255,0.02);
            position: relative; overflow: hidden; transition: box-shadow 1s ease;
        }
        .adn-card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px;
            background: var(--primary); box-shadow: 0 0 20px var(--primary); transition: background 1s, box-shadow 1s;
        }

        /* --- NÚCLEO VISUAL DANTE --- */
        .card-header-visual {
            position: relative; width: 100%; height: 160px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; margin-bottom: 20px;
        }
        .dante-mini-core { position: absolute; width: 220px; height: 220px; z-index: 0; opacity: 0.7; }
        .alias-main-name { position: relative; z-index: 10; font-family: 'Oswald'; font-size: clamp(26px, 7vw, 36px); font-weight: 900; text-transform: uppercase; text-align: center; line-height: 1.1; text-shadow: 0 5px 20px rgba(0,0,0,1), 0 0 20px var(--primary); color: white; letter-spacing: 2px;}
        .archetype-sub { position: relative; z-index: 10; font-family: 'JetBrains Mono'; font-size: 11px; color: #fff; font-weight: 900; letter-spacing: 3px; text-transform: uppercase; margin-top: 10px; background: var(--primary); padding: 4px 15px; border-radius: 4px; color: black; box-shadow: 0 0 20px var(--primary); }

        /* --- CASILLAS DE IDENTIDAD --- */
        .identity-box {
            background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px; padding: 15px; text-align: center; display: flex; flex-direction: column; justify-content: center; margin-bottom: 25px;
        }
        .historical-label { font-family: 'JetBrains Mono'; font-size: 9px; color: #aaa; text-transform: uppercase; letter-spacing: 3px; margin-bottom: 6px; font-weight: 900;}
        .historical-name { font-size: 14px; font-weight: 900; color: #fff; text-transform: uppercase; letter-spacing: 2px; font-family: 'JetBrains Mono'; text-shadow: 0 0 10px rgba(255,255,255,0.3);}

        /* --- SECCIÓN DE STATS Y PSICOMETRÍA --- */
        .section-title { font-family: 'JetBrains Mono'; font-size: 11px; color: #fff; font-weight: 900; letter-spacing: 4px; text-transform: uppercase; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; text-shadow: 0 0 10px rgba(255,255,255,0.5);}
        .section-title::after { content: ''; flex: 1; height: 1px; background: rgba(255,255,255,0.2); }
        
        .summary-text { font-size: 14px; font-weight: 400; line-height: 1.6; color: #fff; margin-bottom: 30px; text-align: justify; font-family: 'Outfit'; background: rgba(255,255,255,0.02); padding: 15px; border-left: 2px solid var(--primary); border-radius: 0 4px 4px 0;}

        /* --- GRÁFICA DE RADAR (PUNTUACIÓN CRUDA) --- */
        .radar-container {
            width: 100%; height: 220px; position: relative; margin-bottom: 30px;
            display: flex; align-items: center; justify-content: center;
        }
        
        /* Hexágono base */
        .radar-bg {
            width: 150px; height: 170px; background: url('data:image/svg+xml;utf8,<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><polygon points="50 0, 100 25, 100 75, 50 100, 0 75, 0 25" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/><polygon points="50 20, 80 35, 80 65, 50 80, 20 65, 20 35" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/><polygon points="50 40, 65 47, 65 53, 50 60, 35 53, 35 47" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/><line x1="50" y1="50" x2="50" y2="0" stroke="rgba(255,255,255,0.1)" stroke-width="1"/><line x1="50" y1="50" x2="100" y2="25" stroke="rgba(255,255,255,0.1)" stroke-width="1"/><line x1="50" y1="50" x2="100" y2="75" stroke="rgba(255,255,255,0.1)" stroke-width="1"/><line x1="50" y1="50" x2="50" y2="100" stroke="rgba(255,255,255,0.1)" stroke-width="1"/><line x1="50" y1="50" x2="0" y2="75" stroke="rgba(255,255,255,0.1)" stroke-width="1"/><line x1="50" y1="50" x2="0" y2="25" stroke="rgba(255,255,255,0.1)" stroke-width="1"/></svg>') no-repeat center;
            background-size: contain; position: relative; z-index: 1;
        }

        /* SVG dinámico dibujado encima */
        .radar-svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; overflow: visible;}
        .radar-polygon { fill: var(--primary); fill-opacity: 0.3; stroke: var(--primary); stroke-width: 2; filter: drop-shadow(0 0 10px var(--primary)); transition: all 1s ease;}

        /* Etiquetas del Radar */
        .radar-label { position: absolute; font-family: 'JetBrains Mono'; font-size: 9px; font-weight: 900; color: #fff; letter-spacing: 1px; text-transform: uppercase; z-index: 3; text-shadow: 0 0 5px black;}
        .lbl-top { top: -20px; left: 50%; transform: translateX(-50%); }
        .lbl-tr { top: 20px; right: -30px; }
        .lbl-br { bottom: 20px; right: -30px; }
        .lbl-bottom { bottom: -20px; left: 50%; transform: translateX(-50%); }
        .lbl-bl { bottom: 20px; left: -30px; }
        .lbl-tl { top: 20px; left: -30px; }

        /* --- BOTTOM NAV REDUCIDA --- */
        .bottom-nav { 
            position: fixed; bottom: 30px; width: 90%; left: 5%; z-index: 1000;
            display: flex; justify-content: space-evenly; align-items: center;
            background: rgba(5, 5, 5, 0.8); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            padding: 10px 20px; border-radius: 60px; border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 40px rgba(0,0,0,0.9);
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; min-width: 80px; cursor: pointer; }
        .icon-circle { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); margin-bottom: 6px; transition: 0.3s; }
        .nav-icon { width: 22px; height: 22px; }
        .nav-text { font-size: 10px; font-weight: 900; letter-spacing: 0.15em; text-transform: uppercase; }
        
        #dante-anchor { width: 60px; height: 60px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.2); background: #000; box-shadow: 0 0 20px rgba(0,0,0,0.8); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.3s;}
        #dante-anchor i { font-size: 24px; color: white; transition: 0.3s; }
        #dante-anchor:active { border-color: var(--primary); box-shadow: 0 0 30px var(--primary); transform: scale(0.95);}
        #dante-anchor:active i { color: var(--primary); }
    </style>
</head>
<body oncontextmenu="return false;">

    <script>
        // --- PARCHE DE BOTÓN ATRÁS Y ZOMBIES INYECTADO AQUÍ ---
        window.history.replaceState({ locked: true }, null, window.location.href);

    <script>
        // ==========================================
        // 1. CARGA DE DATOS 
        // ==========================================
        let sessionId = "";
        let rawData = localStorage.getItem('govotto_user_data');
        let d = rawData ? JSON.parse(rawData) : {};
        
        let alias = "USUARIO_" + (Math.floor(Math.random() * 9000) + 1000); 
        if (d.perfil && d.perfil.alias) alias = d.perfil.alias;
        
        let cityOnly = "NEXUS GLOBAL";
        if (d.perfil && d.perfil.ciudad) cityOnly = d.perfil.ciudad;

        let vto = d.saldoVTO || 0;
        let nivel = d.nivelActual || 1;
        let currentSig = d.dante_sig || "";

        let rawProfile = JSON.parse(localStorage.getItem('dante_profile')) || { greed: 0, lie: 0, ego: 0, power: 0, cognitive: 0, shadow: 0 };

        let arquetipo = "ESPECTRO (SIN DATOS)";
        let colorAlma = "#00ffcc"; 
        let summary = "Debes descender al Limbo (Círculo 01) para que Dante analice el peso de tu alma y recolecte los primeros datos de tu psique.";

        // --- MOTOR DE DIAGNÓSTICO EN TIEMPO REAL ---
        function calculateRealArchetype(p) {
            if (nivel === 1) return { name: "ESPECTRO", color: "#666666", text: "Registros insuficientes. Completar nodo actual para diagnóstico." };
            
            if (p.greed >= 3 && p.power >= 2 && p.lie >= 2) return { name: "EL TIRANO CORPORATIVO", color: "#ff003c", text: "Instintos de depredación máxima. El fin siempre justificará tus medios. Las métricas indican una ausencia casi total de culpa al perjudicar a otros para ganar VTO." };
            if (p.cognitive >= 4 && p.shadow <= 2) return { name: "EL ESTRATEGA FRÍO", color: "#00ffff", text: "Emociones suprimidas a favor de la eficiencia matemática. Eliges tus batallas con precisión quirúrgica y no actúas por impulso, sino por rentabilidad neta." };
            if (p.lie >= 4 && p.shadow >= 3 && p.power <= 0) return { name: "EL MAQUIAVELO OCULTO", color: "#ff00ff", text: "Actúas a través de otros. Tus niveles de engaño son altísimos. Evitas el conflicto frontal pero envenenas las opciones ajenas para salir limpio e impune." };
            if (p.ego >= 4 && p.cognitive <= 2) return { name: "EL NARCISISTA IMPULSIVO", color: "#D4AF37", text: "Buscas validación constante. Tus decisiones están motivadas por el reconocimiento social o el estatus que ganarás, sin calcular el riesgo a largo plazo." };
            if (p.shadow <= 0 && p.power <= -3) return { name: "EL REBAÑO", color: "#c0c0c0", text: "Tu aversión al conflicto te paraliza. Aceptas el dogma por miedo a la exclusión o al castigo. Eres un peón ideal para el sistema, sin voluntad de subvertir." };
            if (p.greed >= 0 && p.cognitive >= 0 && p.lie >= 0) return { name: "EL PRAGMÁTICO LÍQUIDO", color: "#00ffcc", text: "Una mente altamente adaptable. Te arrodillas cuando te conviene y muerdes cuando es seguro hacerlo. Eres un sobreviviente sin anclajes morales fijos." };

            return { name: "MENTE FRACTURADA", color: "#ff9900", text: "Tus patrones son caóticos e inconsistentes. Actúas por impulso puro sin estrategia definida. Eres un peligro tanto para el sistema como para ti mismo." };
        }

        async function initProfile() {
            try {
                // --- PARCHE ANTI-LOOP INYECTADO AQUÍ ---
                const sessionStr = localStorage.getItem('dante_session');
                const legalAccepted = localStorage.getItem('dante_legal_receipt');
                
                if (!sessionStr) throw new Error("No session");
                if (!legalAccepted && !sessionStr.startsWith("CREATOR_")) throw new Error("No Legal Consent");
                
                let session = JSON.parse(sessionStr);
                if (Date.now() - session.ts > 7200000 && !session.hash.includes('BYPASS')) throw new Error("Session Expired");

                sessionId = session.hash;
                // ----------------------------------------

                if (nivel > 1) {
                    const secret = sessionId.substring(0,8) + "VOTTO_VAULT";
                    const msg = new TextEncoder().encode(parseFloat(vto).toFixed(4) + nivel + secret);
                    const hashBuffer = await crypto.subtle.digest('SHA-256', msg);
                    const expectedSig = Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('').substring(0,16);
                    
                    if (currentSig !== expectedSig) {
                        vto = 0; nivel = 1; rawProfile = { greed: 0, lie: 0, ego: 0, power: 0, cognitive: 0, shadow: 0 };
                        arquetipo = "FRAUDE DETECTADO"; colorAlma = "#ff0044"; 
                        summary = "Has intentado alterar las leyes de Dante. Tu cuenta ha sido bloqueada y reiniciada.";
                    } else {
                        let result = calculateRealArchetype(rawProfile);
                        arquetipo = result.name; colorAlma = result.color; summary = result.text;
                    }
                }
            } catch(e) {
                // LIMPIEZA TOTAL Y EXPULSIÓN (Cura del Loop)
                localStorage.removeItem('dante_session'); 
                localStorage.removeItem('dante_legal_receipt');
                localStorage.removeItem('govotto_user_data'); 
                window.location.replace('index.html'); 
                return; // Corta la ejecución de inmediato
            }

            document.documentElement.style.setProperty('--primary', colorAlma);
            populateData();
            drawRadar();
            initCanvas();
            setTimeout(decryptText, 300);
        }

        function populateData() {
            document.getElementById('ui-lvl').innerText = nivel;
            document.getElementById('ui-vto').innerText = parseFloat(vto).toFixed(4);
            
            document.getElementById('ui-main-title').setAttribute('data-final', arquetipo);
            document.getElementById('ui-archetype').setAttribute('data-final', `[ FIRMA: VÁLIDA ]`);
            
            document.getElementById('ui-alias-box').setAttribute('data-final', alias);
            document.getElementById('ui-city-box').setAttribute('data-final', cityOnly);
            document.getElementById('ui-geo').setAttribute('data-final', cityOnly);
            
            document.getElementById('ui-summary').setAttribute('data-final', summary);
            document.getElementById('main-card').style.boxShadow = `0 20px 50px rgba(0,0,0,0.9), inset 0 0 40px ${colorAlma}22`;
        }

        function drawRadar() {
            try {
                const mapScore = (val) => { let v = Math.max(-5, Math.min(10, val)); return ((v + 5) / 15) * 100; };
                let points = [ mapScore(rawProfile.ego), mapScore(rawProfile.greed), mapScore(rawProfile.shadow), mapScore(rawProfile.power), mapScore(rawProfile.lie), mapScore(rawProfile.cognitive) ];
                const centerX = 50; const centerY = 50; const maxRadius = 45; 
                const angleStep = (Math.PI * 2) / 6;
                let path = "";
                for (let i = 0; i < 6; i++) {
                    let angle = (i * angleStep) - (Math.PI / 2);
                    let dist = maxRadius * (points[i] / 100);
                    let x = centerX + Math.cos(angle) * dist;
                    let y = centerY + Math.sin(angle) * dist;
                    path += `${x},${y} `;
                }
                document.getElementById('radar-shape').setAttribute("points", path.trim());
            } catch(e) { console.error("Radar Error", e); }
        }

        const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&*";
        function decryptText() {
            const elements = document.querySelectorAll('[data-final]');
            elements.forEach((el, index) => {
                const finalStr = el.getAttribute('data-final');
                let iterations = 0; const maxIterations = 15 + (index * 4); 

                const interval = setInterval(() => {
                    let randomStr = finalStr.split('').map((char, i) => {
                        if(char === ' ') return ' ';
                        if(i < (iterations / maxIterations) * finalStr.length) return finalStr[i];
                        return chars[Math.floor(Math.random() * chars.length)];
                    }).join('');
                    el.innerText = randomStr; iterations++;
                    if (iterations >= maxIterations) { clearInterval(interval); el.innerText = finalStr; }
                }, 40);
            });
        }

        const bgCanvas = document.getElementById('dante-fractal-bg'); const bgCtx = bgCanvas.getContext('2d');
        const coreCanvas = document.getElementById('mini-core-canvas'); const coreCtx = coreCanvas.getContext('2d');
        let qParticles = [], dParticles = [];

        function initCanvas() {
            bgCanvas.width = window.innerWidth; bgCanvas.height = window.innerHeight;
            coreCanvas.width = 220; coreCanvas.height = 220;

            for(let i=0; i<80; i++) qParticles.push({ x: bgCanvas.width/2, y: bgCanvas.height/2, s: Math.random(), v: Math.random()*0.3+0.1, angle: i*137.5*(Math.PI/180), dist: 0 });
            for(let i=0; i<150; i++) dParticles.push({ a: Math.random()*Math.PI*2, r: Math.random()*40+5, s: Math.random()*1.5 + 0.5, v: Math.random()*0.03+0.01 });
            animateCanvas();
        }

        function animateCanvas() {
            bgCtx.clearRect(0,0,bgCanvas.width,bgCanvas.height);
            qParticles.forEach(p => {
                p.dist += p.v; let x = bgCanvas.width/2 + Math.cos(p.angle)*p.dist; let y = bgCanvas.height/2 + Math.sin(p.angle)*p.dist;
                if(x < 0 || x > bgCanvas.width || y < 0 || y > bgCanvas.height) p.dist = 0;
                bgCtx.beginPath(); bgCtx.arc(x, y, p.s, 0, Math.PI*2); bgCtx.fillStyle = colorAlma; bgCtx.globalAlpha = 0.2; bgCtx.fill();
            });

            coreCtx.clearRect(0,0,220,220);
            dParticles.forEach(p => {
                p.a += p.v; let breath = Math.sin(Date.now()*0.002) * 5;
                let x = 110 + Math.cos(p.a) * (p.r + breath); let y = 110 + Math.sin(p.a) * (p.r + breath);
                coreCtx.beginPath(); coreCtx.arc(x, y, p.s, 0, Math.PI*2);
                coreCtx.fillStyle = colorAlma; coreCtx.shadowBlur = 10; coreCtx.shadowColor = colorAlma; coreCtx.fill();
            });
            requestAnimationFrame(animateCanvas);
        }

        window.onload = () => { initProfile(); };
    </script>
</body>
</html>
