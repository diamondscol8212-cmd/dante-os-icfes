<script>
    const HOST_URL = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1"
        ? "http://localhost:3000"
        : window.location.origin;

    const sessionToken = localStorage.getItem("dante_token");
    const rawUser = localStorage.getItem("dante_user");
    const userObj = rawUser ? JSON.parse(rawUser) : {};
    
    // Extracción limpia del ID del estudiante
    let STUDENT_ID = "elizabeth";
    if (userObj.email) {
        STUDENT_ID = userObj.email.split('@')[0].toLowerCase().trim();
    } else if (userObj.estudiante) {
        STUDENT_ID = userObj.estudiante.toLowerCase().trim();
    }
    
    const INSTITUTION_ID = userObj.institution_id || "colegio_sandbox_default";

    let currentMateriaFiltro = "todas";
    let cacheHistorialCompleto = [];
    let cacheGemeloCompleto = {};
    let cacheOrigenGemelo = "SUPABASE LIVE";

    let chartEvolucion = null;
    let chartRadar = null;

    class PerfilEstudiante {
        static cerrarSesion() {
            localStorage.removeItem("dante_token");
            localStorage.removeItem("dante_user");
            window.location.href = "/login.html";
        }

        static async cargarDatosCompletos() {
            try {
                // Modificado para no fallar si auditoría falla
                const resGemelo = await fetch(`${HOST_URL}/api/cat/gemelo/${STUDENT_ID}`, {
                    headers: { 'x-institution-id': INSTITUTION_ID, 'Authorization': `Bearer ${sessionToken}` }
                }).catch(() => null);

                if (resGemelo && resGemelo.ok) {
                    const jsonGemelo = await resGemelo.json();
                    cacheGemeloCompleto = jsonGemelo.gemelo || {};
                    cacheOrigenGemelo = jsonGemelo.origen || "SUPABASE LIVE";
                    
                    if (Array.isArray(jsonGemelo.gemelo)) {
                        cacheHistorialCompleto = jsonGemelo.gemelo;
                    }
                }

                // Intento secundario por auditoría
                if (!cacheHistorialCompleto || cacheHistorialCompleto.length === 0) {
                    const resAuditoria = await fetch(`${HOST_URL}/api/cat/auditoria?estudiante=${STUDENT_ID}&institution_id=${INSTITUTION_ID}`, {
                        headers: { 'x-institution-id': INSTITUTION_ID, 'Authorization': `Bearer ${sessionToken}` }
                    }).catch(() => null);

                    if (resAuditoria && resAuditoria.ok) {
                        const jsonAuditoria = await resAuditoria.json();
                        cacheHistorialCompleto = jsonAuditoria.data || [];
                    }
                }

                this.procesarYRenderizarVistas();
            } catch (err) {
                console.error("🚨 [PERFIL LOAD ERROR]:", err.message);
                this.procesarYRenderizarVistas();
            }
        }

        static cambiarFiltroMateria(materia, btnEl) {
            document.querySelectorAll('.tab-materia-btn').forEach(b => b.classList.remove('active'));
            btnEl.classList.add('active');
            currentMateriaFiltro = materia;
            this.procesarYRenderizarVistas();
        }

        static procesarYRenderizarVistas() {
            const nombreEstudianteCapitalizado = STUDENT_ID.toUpperCase();
            document.getElementById("lblSubtituloAlumno").innerText = `> EXPEDIENTE Y TRAYECTORIA LONGITUDINAL DE: ${nombreEstudianteCapitalizado}`;

            const streak = localStorage.getItem("dante_streak_count") || "1";
            document.getElementById("kpiRacha").innerText = `${streak} 🔥`;
            const lblRachaBox = document.getElementById("lblRachaDiasBox");
            if (lblRachaBox) lblRachaBox.innerText = `${streak} ${streak === "1" ? 'Día' : 'Días'} Racha`;

            // FILTRADO INTELIGENTE
            let historialFiltrado = cacheHistorialCompleto;
            if (currentMateriaFiltro !== "todas") {
                historialFiltrado = cacheHistorialCompleto.filter(h => {
                    const m = String(h.materia || h.area_general || '').toLowerCase().trim();
                    const f = currentMateriaFiltro.toLowerCase().trim();
                    return m === f || (m.includes('lectura') && f.includes('lectura')) || m.includes(f) || f.includes(m);
                });
            }

            let ultimoRegistro = null;
            if (historialFiltrado.length > 0) {
                ultimoRegistro = historialFiltrado[0]; // Toma el más reciente
            } else if (cacheHistorialCompleto.length > 0) {
                ultimoRegistro = cacheHistorialCompleto[0]; // Fallback si el filtro no coincide exactamente
            }

            let maxThetaVal = 0.0000;
            let maxPuntajeVal = 50;
            let iriVal = 0.50;
            let itemsResp = {};

            if (ultimoRegistro) {
                if (Array.isArray(ultimoRegistro.historial_theta) && ultimoRegistro.historial_theta.length > 0) {
                    maxThetaVal = parseFloat(ultimoRegistro.historial_theta[ultimoRegistro.historial_theta.length - 1]);
                } else if (ultimoRegistro.theta_final !== undefined && ultimoRegistro.theta_final !== null) {
                    maxThetaVal = parseFloat(ultimoRegistro.theta_final);
                } else if (ultimoRegistro.theta_algebra_calculo !== undefined) {
                    maxThetaVal = parseFloat(ultimoRegistro.theta_algebra_calculo);
                }

                itemsResp = typeof ultimoRegistro.items_respondidos === 'string' 
                    ? JSON.parse(ultimoRegistro.items_respondidos) 
                    : (ultimoRegistro.items_respondidos || {});

                maxPuntajeVal = itemsResp.puntaje_escalonado || ultimoRegistro.puntaje_escalonado || Math.max(1, Math.min(100, Math.round(50 + (maxThetaVal * 13.8))));
                
                iriVal = itemsResp.indice_recuperacion_intelectual !== undefined 
                    ? parseFloat(itemsResp.indice_recuperacion_intelectual) 
                    : (ultimoRegistro.indice_recuperacion_intelectual || 0.50);

                document.getElementById("kpiTheta").innerText = maxThetaVal.toFixed(4);
                document.getElementById("kpiPuntaje").innerText = `${maxPuntajeVal} / 100 pts`;
                document.getElementById("kpiIRI").innerText = `${Math.round(iriVal * 100)}%`;
            }

            let rango = "Platino II";
            if (maxPuntajeVal > 75) rango = "Élite MÁSTER";
            else if (maxPuntajeVal > 60) rango = "Diamante Visoespacial";
            else if (maxPuntajeVal < 45) rango = "Oro de Enfoque";
            document.getElementById("lblRangoBadge").innerText = `RANGO: ${rango}`;

            const minVal = Math.max(1, maxPuntajeVal - 5);
            const targetVal = maxPuntajeVal;
            const maxVal = Math.min(100, maxPuntajeVal + 5);

            document.getElementById('lblOrigenGemelo').innerText = `${cacheOrigenGemelo || 'SUPABASE LIVE'}`;
            document.getElementById('val-min').innerText = minVal;
            document.getElementById('val-target').innerText = targetVal;
            document.getElementById('val-max').innerText = maxVal;
            document.getElementById('val-error').innerText = `Margen de Error Bayesiano: ±5 pts (Credibilidad 95%)`;

            const bandEl = document.getElementById('band');
            const pinEl = document.getElementById('pin-marker');
            if (bandEl && pinEl) {
                bandEl.style.left = `${minVal}%`;
                bandEl.style.width = `${Math.max(2, maxVal - minVal)}%`;
                pinEl.style.left = `${targetVal}%`;
            }

            const adn = itemsResp.adn_empaquetado || itemsResp.adn_cognitivo || ultimoRegistro?.adn_cognitivo || cacheGemeloCompleto.adn_cognitivo || {};
            
            if (ultimoRegistro) {
                document.getElementById("lblVulnerabilidadTxt").innerText = adn.vulnerabilidad_dominante || "Sensibilidad al ritmo de respuesta bajo presión.";
                document.getElementById("lblPrescripcionTxt").innerText = adn.prescripcion_clinica || "Aplica la técnica de escaneo estructurado descartando distractores.";
                document.getElementById("lblCronicaTxt").innerText = adn.cronica_narrativa || `${nombreEstudianteCapitalizado}, tu perfil en esta materia refleja consistencia analítica. Maintén un ritmo estable.`;
            }

            this.generarListaTemasEstudio(currentMateriaFiltro);

            const mapaSesgos = adn.mapa_calor_sesgos || itemsResp.mapa_calor_sesgos || {
                attr_heuristica_lineal: 0.15,
                attr_inversion_operacional: 0.15,
                attr_omision_conversion: 0.15,
                attr_error_geometrico: 0.15
            };
            this.renderizarMapaCalor(mapaSesgos);

            this.renderizarTablaHistorial(historialFiltrado.length > 0 ? historialFiltrado : cacheHistorialCompleto);
            this.renderizarGraficaEvolucion(historialFiltrado.length > 0 ? historialFiltrado : cacheHistorialCompleto);
            this.renderizarRadar(adn);

            this.calcularPuntajeGlobal500();
        }

        static calcularPuntajeGlobal500() {
            const PESOS = { 'matematicas': 3, 'lectura_critica': 3, 'ciencias_naturales': 3, 'sociales_ciudadanas': 3, 'ingles': 1 };
            const puntajesMateria = { 'matematicas': 50, 'lectura_critica': 50, 'ciencias_naturales': 50, 'sociales_ciudadanas': 50, 'ingles': 50 };
            let totalClicsHoy = 0;

            if (Array.isArray(cacheHistorialCompleto) && cacheHistorialCompleto.length > 0) {
                cacheHistorialCompleto.forEach(reg => {
                    const m = String(reg.materia || reg.area_general || '').toLowerCase().trim();
                    let matKey = 'matematicas';
                    if (m.includes('lectura')) matKey = 'lectura_critica';
                    else if (m.includes('ciencias')) matKey = 'ciencias_naturales';
                    else if (m.includes('ingles')) matKey = 'ingles';

                    const itemsR = typeof reg.items_respondidos === 'string' ? JSON.parse(reg.items_respondidos) : (reg.items_respondidos || {});
                    let pts = itemsR.puntaje_escalonado || reg.puntaje_escalonado;
                    
                    if (!pts) {
                        let th = reg.theta_algebra_calculo !== undefined ? reg.theta_algebra_calculo : (reg.theta_final || reg.theta || 0);
                        pts = Math.max(1, Math.min(100, Math.round(50 + (parseFloat(th) * 13.8))));
                    }

                    if (puntajesMateria[matKey] !== undefined) {
                        puntajesMateria[matKey] = pts;
                    }

                    if (itemsR.historico_clics && Array.isArray(itemsR.historico_clics)) {
                        totalClicsHoy += itemsR.historico_clics.length;
                    }
                });
            }

            let sumaPonderada = 0; let sumaPesos = 0;
            Object.keys(PESOS).forEach(k => {
                sumaPonderada += (puntajesMateria[k] * PESOS[k]);
                sumaPesos += PESOS[k];
            });

            let puntajeGlobal500 = Math.round((sumaPonderada / (100 * sumaPesos)) * 500);
            puntajeGlobal500 = Math.max(50, Math.min(500, puntajeGlobal500 || 290));

            const lblGlobal = document.getElementById("lblPuntajeGlobal500");
            if (lblGlobal) {
                lblGlobal.innerHTML = `${puntajeGlobal500} <span class="text-xl sm:text-2xl text-slate-400 font-normal">/ 500 pts</span>`;
            }
            
            const barGlobal = document.getElementById("barPuntajeGlobal");
            if (barGlobal) {
                const pctBarra = ((puntajeGlobal500 / 500) * 100).toFixed(1);
                barGlobal.style.width = `${pctBarra}%`;
            }

            let probMeta = Math.min(99, Math.max(15, Math.round((puntajeGlobal500 / 350) * 80)));
            const lblProb = document.getElementById("lblProbabilidadMeta");
            if (lblProb) lblProb.innerText = `${probMeta}% Prob. Meta 350+`;

            const chkM1 = document.getElementById("chkMision1");
            const lblM1 = document.getElementById("lblProgresoMision1");
            if (chkM1 && lblM1) {
                const visCount = Math.min(15, totalClicsHoy || 6);
                lblM1.innerText = `${visCount}/15`;
                if (visCount >= 15) {
                    chkM1.checked = true;
                    lblM1.className = "text-[10px] font-mono text-emerald-400 font-bold";
                    lblM1.innerText = "✓ COMPLETADA";
                }
            }
        }

        static generarListaTemasEstudio(materia) {
            const contenedorList = document.getElementById("listaTemasEstudioHtml");
            if (!contenedorList) return;
            contenedorList.innerHTML = "";

            let temas = [];
            if (materia === "ingles") {
                temas.push("Comprensión de avisos publicitarios y señales de lugar público.");
                temas.push("Uso de tiempos verbales compuestos (Present Perfect vs. Past Simple).");
                temas.push("Estrategias de lectura rápida por palabras clave (Scanning y Skimming).");
            } else if (materia === "matematicas") {
                temas.push("Regla de tres simple e inversa (Resolución de proporcionalidad).");
                temas.push("Conversión de unidades de medida (longitud, área y volumen).");
                temas.push("Despeje de ecuaciones algebraicas e interpretación de gráficas.");
            } else if (materia.includes("lectura")) {
                temas.push("Identificación de la tesis principal en textos argumentativos.");
                temas.push("Análisis de conectores lógicos de oposición (sin embargo, excepto).");
                temas.push("Distinción entre premisa, evidencia y conclusión.");
            } else {
                temas.push("Repaso general de Álgebra y funciones lineales.");
                temas.push("Lectura crítica de textos argumentativos y filosóficos.");
                temas.push("Análisis de gráficos de datos en Ciencias Naturales.");
            }

            temas.forEach(t => {
                contenedorList.innerHTML += `<li class="flex items-start gap-2"><span class="text-[var(--cyan-core)] font-bold">✓</span> <span>${t}</span></li>`;
            });
        }

        static renderizarMapaCalor(sesgos) {
            const cont = document.getElementById("contenedorBarrasSesgos");
            if (!cont) return;
            cont.innerHTML = "";

            const itemsSesgos = [
                { k: "attr_heuristica_lineal", n: "Heurística Lineal", v: sesgos.attr_heuristica_lineal || sesgos.heuristica_lineal || 0.15, desc: "Traducción secuencial literal." },
                { k: "attr_inversion_operacional", n: "Inversión Operacional", v: sesgos.attr_inversion_operacional || sesgos.inversion_operacional || 0.15, desc: "Invertir la relación de adjetivos o conectores." },
                { k: "attr_omision_conversion", n: "Omisión de Conversión", v: sesgos.attr_omision_conversion || sesgos.omision_conversion || 0.15, desc: "Ignorar variables de escala antes de responder." },
                { k: "attr_error_geometrico", n: "Error Geométrico / Contextual", v: sesgos.attr_error_geometrico || sesgos.error_geometrico || 0.15, desc: "Confundir elementos espaciales o aislar frases." }
            ];

            itemsSesgos.forEach(s => {
                const pct = Math.round((parseFloat(s.v) > 1.0 ? parseFloat(s.v) : parseFloat(s.v) * 100));
                let gradientFill = "linear-gradient(90deg, #10b981 0%, #2ecc71 100%)";
                let colorText = "var(--emerald)";
                if (pct >= 25) {
                    gradientFill = "linear-gradient(90deg, #f59e0b 0%, #d4af37 100%)";
                    colorText = "var(--gold-satin)";
                }
                if (pct >= 55) {
                    gradientFill = "linear-gradient(90deg, #f43f5e 0%, #e74c3c 100%)";
                    colorText = "var(--crimson)";
                }

                cont.innerHTML += `
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-slate-300 font-medium text-xs font-sans">${s.n}</span>
                            <span class="font-bold font-mono" style="color: ${colorText}">${pct}%</span>
                        </div>
                        <div class="mini-bar-bg"><div class="mini-bar-fill" style="width: ${pct}%; background: ${gradientFill}"></div></div>
                    </div>
                `;
            });
        }

        static renderizarTablaHistorial(registros) {
            const body = document.getElementById("tablaHistorialBody");
            if (!body) return;

            if (!registros || registros.length === 0) {
                body.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-xs text-slate-500 italic font-mono">> No hay simulacros registrados.</td></tr>`;
                return;
            }

            body.innerHTML = "";
            registros.forEach(r => {
                const fecha = new Date(r.ultima_actualizacion || r.updated_at || r.created_at || Date.now()).toLocaleDateString('es-CO');
                const materiaNombre = String(r.materia || r.area_general || 'general').replace('_', ' ').toUpperCase();
                
                let th = parseFloat(r.theta_algebra_calculo || r.theta_final || r.theta || 0.0);
                const itemsResp = typeof r.items_respondidos === 'string' ? JSON.parse(r.items_respondidos) : (r.items_respondidos || {});
                const pts = itemsResp.puntaje_escalonado || r.puntaje_escalonado || Math.round(50 + (th * 13.8));

                body.innerHTML += `
                    <tr class="hover:bg-white/[0.02] transition-colors">
                        <td class="p-3 sm:p-4 font-mono text-xs text-slate-400">${fecha}</td>
                        <td class="p-3 sm:p-4 uppercase text-xs font-semibold text-slate-200 font-sans">${materiaNombre}</td>
                        <td class="p-3 sm:p-4 font-mono font-bold text-sky-400">${th.toFixed(4)}</td>
                        <td class="p-3 sm:p-4 font-mono font-bold text-emerald-400">${pts} / 100 pts</td>
                        <td class="p-3 sm:p-4 font-mono text-xs">
                            <span class="px-2.5 py-1 rounded-full text-[10px] font-bold bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 font-mono">EVALUADO</span>
                        </td>
                    </tr>
                `;
            });
        }

        static renderizarGraficaEvolucion(historial) {
            let seriesData = [];
            let fechas = [];

            if (historial && historial.length > 0) {
                historial.forEach((r, i) => {
                    fechas.push(`Simulacro #${i + 1}`);
                    let th = parseFloat(r.theta_algebra_calculo || r.theta_final || r.theta || 0.0);
                    seriesData.push(parseFloat(th.toFixed(4)));
                });
            } else {
                fechas = ['Línea Base'];
                seriesData = [0.0000];
            }

            const options = {
                series: [{ name: 'Habilidad Latente (θ)', data: seriesData }],
                chart: { type: 'area', height: 260, toolbar: { show: false }, background: 'transparent' },
                colors: ['#51e2f5'], theme: { mode: 'dark' }, stroke: { curve: 'smooth', width: 3 },
                fill: { type: 'gradient', gradient: { opacityFrom: 0.45, opacityTo: 0.05 } },
                xaxis: { categories: fechas, labels: { style: { colors: '#9499a7', fontSize: '10px', fontFamily: 'JetBrains Mono' } } },
                yaxis: { labels: { style: { colors: '#9499a7', fontFamily: 'JetBrains Mono' } } }
            };

            if (chartEvolucion) chartEvolucion.destroy();
            const elChart = document.querySelector("#chartEvolucionTheta");
            if (elChart) {
                chartEvolucion = new ApexCharts(elChart, options);
                chartEvolucion.render();
            }
        }

        static renderizarRadar(adn) {
            const options = {
                series: [{
                    name: 'Atributos Cognitivos',
                    data: [
                        parseFloat(100 - (adn.impulsividad || 20)),
                        parseFloat(adn.estabilidad || 75),
                        parseFloat(100 - (adn.fatiga || 0)),
                        parseFloat(adn.recuperacion || 59),
                        parseFloat(adn.estabilidad || 75)
                    ]
                }],
                chart: { type: 'radar', height: 260, toolbar: { show: false }, background: 'transparent' },
                colors: ['#d4af37'], theme: { mode: 'dark' },
                xaxis: { categories: ['Autorregulación', 'Foco', 'Resistencia', 'Recuperación', 'Comprensión'] },
                yaxis: { show: false, max: 100 }
            };

            if (chartRadar) chartRadar.destroy();
            const elRadar = document.querySelector("#chartRadarDimensiones");
            if (elRadar) {
                chartRadar = new ApexCharts(elRadar, options);
                chartRadar.render();
            }
        }
    }

    window.onload = () => {
        PerfilEstudiante.cargarDatosCompletos();
    };
</script>
